name: Daily WishBunny Scraper

on:
  schedule:
    # Runs at 00:00 UTC every day, which is 09:00 KST
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allows manual run from GitHub UI

jobs:
  scrape_and_mail:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Limit permissions to writing contents (for committing data)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python scrape_wishbunny.py

      - name: Commit and Push Data History
        run: |
          git config --global user.name "WishBunny Bot"
          git config --global user.email "bot@wishbunny.me"
          git add wishbunny_history.csv
          # Only commit if there are changes
          git commit -m "Auto-update history data [skip ci]" || echo "No changes to commit"
          git push
